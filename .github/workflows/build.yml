name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
      - run: uv sync --locked --all-groups --extra plot
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy src scripts tests

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
      - run: uv sync --locked --all-groups --extra plot
      - run: uv run --locked pytest --cov=odsbox_cli --cov-report=term-missing --cov-report=xml --cov-fail-under=85
      - uses: actions/upload-artifact@v6
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.xml

  package:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
      - run: uv sync --locked --all-groups
      - run: uv build --no-sources
      - run: uv run --locked python scripts/package_smoke.py --dist dist
      - uses: actions/upload-artifact@v6
        with:
          name: distributions-${{ matrix.os }}
          path: dist/*

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
      - run: uv sync --locked --all-groups
      - run: uv export --locked --format requirements-txt --no-emit-project --no-hashes --all-groups --extra plot --output-file requirements-audit.txt
      - run: uv run --locked pip-audit --strict -r requirements-audit.txt

  release:
    needs: [lint, test, package, audit]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/odsbox-cli/
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v8.2.0
      - run: uv sync --locked --all-groups
      - name: Version and build a new release
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run --no-sync python scripts/release.py release
      - name: Publish new artifacts
        if: steps.version.outputs.released == 'true'
        run: uv publish --trusted-publishing always
